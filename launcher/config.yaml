name: GitHub Project Launcher
version: "0.2.0"
slug: github_project_launcher
description: Private GitHub launcher for syncing and managing Dale's projects on Home Assistant
url: https://github.com/you209/Launcher
arch:
  - amd64
startup: application
boot: manual
init: false
webui: "http://[HOST]:[PORT:8000]"
ports:
  8000/tcp: 8002
ports_description:
  8000/tcp: Launcher web interface
map:
  - type: addons
    read_only: false
  - type: data
    read_only: false
hassio_api: true
options:
  github_username: you209
  launcher_repo: you209/Launcher
  launcher_branch: main
  launcher_token: ""
  github_token: ""
  app_repositories:
    - name: Quote-Machine
      repo: you209/Quote-Machine
      branch: main
      token: ""
    - name: ST
      repo: you209/ST
      branch: main
      token: ""
    - name: Find-My-Local-Pollie
      repo: you209/Find-My-Local-Pollie
      branch: main
      token: ""
    - name: Family-Database
      repo: you209/Family-Database
      branch: main
      token: ""
  admin_username: admin
  admin_password: "change-this-now"
  auto_pull: true
  sync_interval_minutes: 15
schema:
  github_username: str
  launcher_repo: str
  launcher_branch: str
  launcher_token: password
  github_token: password?
  app_repositories:
    - name: str
      repo: str
      branch: str
      token: password
  admin_username: str
  admin_password: password
  auto_pull: bool
  sync_interval_minutes: int
